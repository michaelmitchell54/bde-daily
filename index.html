<style>
  /* Beckley Electrical brand: navy #112240, red #dc1e24, dot grid */
  :root {
    --navy: #112240; --card: #ffffff; --ink: #26251f; --mut: #5c5952;
    --line: #e9e5de; --brand: #dc1e24; --bad: #b51a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: #14233c; --ink: #e8edf5; --mut: #9fb0ca;
      --line: #223757; --brand: #f0575c; --bad: #f0575c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    background: var(--navy) radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.5px);
    background-size: 16px 16px;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .card {
    background: var(--card); border-radius: 18px; border-top: 3px solid var(--brand);
    box-shadow: 0 2px 6px rgba(0,0,0,0.25), 0 10px 32px rgba(0,0,0,0.25);
    padding: 1.6rem 1.5rem; width: 100%; max-width: 22rem;
  }
  .logo { width: 150px; height: auto; margin-bottom: 0.4rem; }
  .logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .logo-light { display: none; }
    .logo-dark { display: inline; }
  }
  h1 { font-size: 1.35rem; font-weight: 800; margin: 0.1rem 0 0.3rem; letter-spacing: -0.01em; }
  p { font-size: 0.85rem; color: var(--mut); margin: 0 0 1rem; }
  input {
    width: 100%; font: inherit; font-size: 1.05rem; font-weight: 600; padding: 0.7rem 0.9rem;
    border: 1.5px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--brand); }
  button {
    width: 100%; margin-top: 0.7rem; font: inherit; font-size: 0.95rem; font-weight: 700;
    padding: 0.8rem 0; border: 0; border-radius: 999px; background: var(--brand); color: #fff; cursor: pointer;
  }
  .err { color: var(--bad); font-size: 0.8rem; margin: 0.5rem 0 0; min-height: 1.1em; }
  .busy { opacity: 0.6; pointer-events: none; }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryUnlock(pass) {
  const keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
    keyMat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct));
  const html = new TextDecoder().decode(plain);
  try { localStorage.setItem('bp-pass', pass); } catch (e) {}
  document.open();
  document.write(html);
  document.close();
}
const form = document.getElementById('form');
const err = document.getElementById('err');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const pass = document.getElementById('pass').value.trim().toLowerCase();
  if (!pass) return;
  err.textContent = '';
  form.classList.add('busy');
  document.getElementById('go').textContent = 'Opening…';
  try {
    await tryUnlock(pass);
  } catch (ex) {
    form.classList.remove('busy');
    document.getElementById('go').textContent = 'Open';
    err.textContent = 'That code is not right. Check it and try again.';
  }
});
(async () => {
  let saved = null;
  try { saved = localStorage.getItem('bp-pass'); } catch (e) {}
  if (saved) {
    form.classList.add('busy');
    document.getElementById('go').textContent = 'Opening…';
    try { await tryUnlock(saved); return; } catch (ex) {}
    form.classList.remove('busy');
    document.getElementById('go').textContent = 'Open';
  }
})();
</script>
